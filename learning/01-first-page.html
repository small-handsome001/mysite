<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>第 1 课 · 第一个页面</title>
</head>
<body>

  <h1>我的第一个网页</h1>

  <p>这一行是段落文字。</p>

  <h2>下面这段是 HTML 源码</h2>

  <pre>
&lt;!DOCTYPE html&gt;
&lt;html lang="zh-CN"&gt;
&lt;head&gt;
  &lt;title&gt;第一个页面&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;我的第一个网页&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;
  </pre>

  <p>浏览器把这堆文字<strong>翻译</strong>成了你看到的样子。</p>

  <h2>打开 F12 → Elements</h2>
  <p>你会看到一棵树，就是浏览器理解后的 DOM。双击文字可以直接改，刷新就恢复。</p>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第 6 课 · JS 练习</title>
  <link rel="stylesheet" href="06-demo.css" />
</head>
<body>

  <h1>JS 练习</h1>

  <p class="intro">
    这个页面的样式不用你写，按钮的样式也都写好了。
    你要做的是写 JS，让按钮"真的有用"。
  </p>

  <div class="panel">

    <h2>任务 1：暗色模式</h2>
    <p>点下面的按钮，给 body 加/删 dark 类。</p>
    <button id="toggle" class="btn">切换暗色</button>

  </div>

  <div class="panel">

    <h2>任务 2：点击计数</h2>
    <p>当前点击次数：<span id="count">0</span></p>
    <button id="counter" class="btn">点我 +1</button>

  </div>

  <div class="panel">

    <h2>任务 3：打印到控制台</h2>
    <p>每次点击都用 console.log 打印。按 F12 → Console 看。</p>

  </div>

  <!-- script 放 body 末尾：这样上面所有元素都已经生成好了 -->
  <script src="06-demo.js"></script>

</body>
</html>
